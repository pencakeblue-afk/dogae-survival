 h+='</div><div class="card"><h2>인생 지도</h2><div class="map">';for(let i=0;i<34;i++)h+='<i class="'+(i<mi?"dn":i==mi?"nw":"")+'"></i>';h+='</div><div class="mut">한 칸 = 1개월 · 2025.3 → 2027.12</div></div>'+netCard()+'</div></div>';
